<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Overlay MLBB - DARKSYSTEM vs MUSUH ALLAH</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Barlow+Condensed:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#1f6bff; --blue-d:#0b2a66;
  --red:#ff2d4a;  --red-d:#5e0a1a;
  --ink:#0a0d14;  --gold:#ffc83d; --white:#f4f7ff;
}
html,body{margin:0;height:100%;background:transparent;overflow:hidden}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;
  font-family:'Oswald','Arial Narrow',sans-serif;color:var(--white)}
#ov{opacity:0;transition:opacity .6s}
#ov.on{opacity:1}

/* scoreboard */
#score{position:absolute;top:0;left:50%;width:1260px;margin-left:-630px;height:96px;
  display:flex;align-items:stretch;transform:translateY(-110%);transition:transform .7s cubic-bezier(.2,.9,.2,1)}
#ov.on #score{transform:none}
.side{flex:1;display:flex;align-items:center;gap:22px;padding:0 26px;background:var(--ink)}
.side.l{border-bottom:6px solid var(--blue);background:linear-gradient(90deg,var(--ink),var(--blue-d));
  clip-path:polygon(0 0,100% 0,calc(100% - 26px) 100%,0 100%)}
.side.r{border-bottom:6px solid var(--red);background:linear-gradient(270deg,var(--ink),var(--red-d));flex-direction:row-reverse;
  clip-path:polygon(26px 0,100% 0,100% 100%,0 100%)}
.name{font-size:38px;font-weight:700;letter-spacing:1px;flex:1;white-space:nowrap}
.r .name{text-align:right}
.kills{font-size:54px;font-weight:700;min-width:70px;text-align:center}
.l .kills{color:#7fb0ff}.r .kills{color:#ff8a9b}
.mini{font-family:'Barlow Condensed',sans-serif;font-size:24px;font-weight:600;display:flex;gap:16px;opacity:.9}
.mini b{color:var(--gold);font-weight:600}
.mid{width:170px;background:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;
  border-bottom:6px solid var(--gold)}
#timer{font-size:46px;font-weight:700;line-height:1}
.mid small{font-family:'Barlow Condensed',sans-serif;font-size:18px;color:var(--gold);letter-spacing:2px}

/* kartu pemain */
.col{position:absolute;top:330px;width:330px;display:flex;flex-direction:column;gap:10px}
.col.l{left:0;transform:translateX(-110%)}
.col.r{right:0;transform:translateX(110%)}
#ov.on .col{transform:none;transition:transform .8s .25s cubic-bezier(.2,.9,.2,1)}
.p{display:flex;align-items:center;gap:12px;height:68px;padding:0 16px;background:rgba(10,13,20,.88)}
.l .p{border-left:6px solid var(--blue);clip-path:polygon(0 0,100% 0,calc(100% - 14px) 100%,0 100%)}
.r .p{border-right:6px solid var(--red);flex-direction:row-reverse;clip-path:polygon(14px 0,100% 0,100% 100%,0 100%)}
.p .n{flex:1;font-size:26px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r .p .n{text-align:right}
.p .k{font-family:'Barlow Condensed',sans-serif;font-size:28px;font-weight:600;color:var(--gold)}
</style>
</head>
<body>
<div id="stage">
 <div id="ov">
  <div id="score">
    <div class="side l">
      <div class="name" id="nameL"></div>
      <div class="mini"><span>TWR <b id="twL">0</b></span><span>GOLD <b id="gdL">0</b></span></div>
      <div class="kills" id="kL">0</div>
    </div>
    <div class="mid"><div id="timer">00:00</div><small>MATCH</small></div>
    <div class="side r">
      <div class="name" id="nameR"></div>
      <div class="mini"><span>TWR <b id="twR">0</b></span><span>GOLD <b id="gdR">0</b></span></div>
      <div class="kills" id="kR">0</div>
    </div>
  </div>
  <div class="col l" id="colL"></div>
  <div class="col r" id="colR"></div>
 </div>
</div>

<script>
/* ====== EDIT DI SINI ====== */
const CFG = {
  left:  { name:"DARKSYSTEM",  kills:0, towers:null, gold:null, players:[] },
  right: { name:"MUSUH ALLAH", kills:0, towers:null, gold:null, players:[] },
  wsUrl: "ws://localhost:8765"   // opsional: dipakai script deteksi otomatis
};
/* ========================== */

const $ = id => document.getElementById(id);
const ov = $('ov');
let secs = 0, tick = null, ext = false;

function fit(){ const s=Math.min(innerWidth/1920, innerHeight/1080); $('stage').style.transform='scale('+s+')'; }
addEventListener('resize',fit); fit();

function cards(el, list){
  el.innerHTML = list.map(p=>'<div class="p"><div class="n">'+p.n+'</div><div class="k">'+p.k+'</div></div>').join('');
}
function render(){
  const L=CFG.left,R=CFG.right;
  $('nameL').textContent=L.name; $('nameR').textContent=R.name;
  $('kL').textContent=L.kills; $('kR').textContent=R.kills;
  opt('twL',L.towers); opt('twR',R.towers); opt('gdL',L.gold); opt('gdR',R.gold);
  cards($('colL'),L.players); cards($('colR'),R.players);
}
function opt(id,v){ const e=$(id); e.textContent=v==null?'':v; e.parentElement.style.display=v==null?'none':''; }
function fmt(s){ return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); }

function show(){
  if(ov.classList.contains('on')) return;
  ov.classList.add('on');
  if(ext) return;
  secs=0; $('timer').textContent=fmt(0);
  clearInterval(tick); tick=setInterval(()=>{ secs++; $('timer').textContent=fmt(secs); },1000);
}
function hide(){ ov.classList.remove('on'); clearInterval(tick); }

/* Kontrol manual: S = muncul/hilang, Q/A = kill kiri +/-, E/D = kill kanan +/- */
addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if(k==='s') ov.classList.contains('on')?hide():show();
  if(k==='q'){CFG.left.kills++;render()} if(k==='a'){CFG.left.kills=Math.max(0,CFG.left.kills-1);render()}
  if(k==='e'){CFG.right.kills++;render()} if(k==='d'){CFG.right.kills=Math.max(0,CFG.right.kills-1);render()}
});

/* Kontrol otomatis dari script lokal (opsional).
   Kirim JSON: {"show":true} / {"show":false} / {"left":{"kills":3,"gold":"12.4k"},"right":{...}} */
function connect(){
  try{
    const ws=new WebSocket(CFG.wsUrl);
    ws.onmessage=m=>{
      try{
        const d=JSON.parse(m.data);
        if(d.left) Object.assign(CFG.left,d.left);
        if(d.right) Object.assign(CFG.right,d.right);
        if(d.timer){ ext=true; clearInterval(tick); $('timer').textContent=d.timer; }
        render();
        if(d.show===true) show(); if(d.show===false) hide();
      }catch(_){}
    };
    ws.onclose=()=>{ if(ext) hide(); setTimeout(connect,3000); };
    ws.onerror=()=>ws.close();
  }catch(_){ setTimeout(connect,5000); }
}
render(); connect();

/* Tes cepat: buka index.html?demo=1 */
if(/[?&]demo=1/.test(location.search)) show();
</script>
</body>
</html>
