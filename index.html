<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Overlay MLBB Portrait - DARKSYSTEM vs MUSUH ALLAH</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Barlow+Condensed:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#1f6bff; --blue-d:#0b2a66;
  --red:#ff2d4a;  --red-d:#5e0a1a;
  --ink:#0a0d14;  --gold:#ffc83d; --white:#f4f7ff;
  --sb:1166px; --cy:850px;
}
html,body{margin:0;height:100%;background:transparent;overflow:hidden}
#stage{position:absolute;left:0;top:0;width:1080px;height:1920px;transform-origin:0 0;
  font-family:'Oswald','Arial Narrow',sans-serif;color:var(--white)}
#ov{position:absolute;left:0;top:0;width:100%;height:100%;opacity:0;transition:opacity .6s}
#ov.on{opacity:1}

/* bingkai minimap */
#mm{position:absolute;box-sizing:border-box;border:4px solid var(--blue);pointer-events:none;
  box-shadow:0 0 0 2px rgba(10,13,20,.7),0 0 22px rgba(31,107,255,.65),inset 0 0 12px rgba(31,107,255,.35)}
#mm::after{content:"";position:absolute;left:-4px;bottom:-4px;width:46px;height:6px;background:var(--gold)}

/* scoreboard (di bagian bawah area game) */
#score{position:absolute;left:50%;top:var(--sb);width:720px;margin-left:-360px;height:78px;display:flex;
  opacity:0;transform:translateY(16px);transition:transform .7s cubic-bezier(.2,.9,.2,1),opacity .7s}
#ov.on #score{opacity:1;transform:none}
.side{flex:1;display:flex;align-items:center;gap:12px;padding:0 18px;background:var(--ink)}
.side.l{border-bottom:5px solid var(--blue);background:linear-gradient(90deg,var(--ink),var(--blue-d));
  clip-path:polygon(0 0,100% 0,calc(100% - 20px) 100%,0 100%)}
.side.r{border-bottom:5px solid var(--red);background:linear-gradient(270deg,var(--ink),var(--red-d));flex-direction:row-reverse;
  clip-path:polygon(20px 0,100% 0,100% 100%,0 100%)}
.name{font-size:26px;font-weight:700;letter-spacing:1px;flex:1;white-space:nowrap}
.r .name{text-align:right}
.kills{font-size:44px;font-weight:700;min-width:56px;text-align:center}
.l .kills{color:#7fb0ff}.r .kills{color:#ff8a9b}
.mini{font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:600;display:flex;gap:10px;opacity:.9}
.mini b{color:var(--gold);font-weight:600}
.mid{width:130px;background:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;
  border-bottom:5px solid var(--gold)}
#timer{font-size:36px;font-weight:700;line-height:1}
.mid small{font-family:'Barlow Condensed',sans-serif;font-size:15px;color:var(--gold);letter-spacing:2px}

/* kartu KDA */
.col{position:absolute;left:0;top:var(--cy);width:250px;display:flex;flex-direction:column;gap:8px;transform:translateX(-110%)}
#ov.on .col{transform:none;transition:transform .8s .25s cubic-bezier(.2,.9,.2,1)}
.p{display:flex;align-items:center;gap:12px;height:58px;padding:0 16px;background:rgba(10,13,20,.88);
  border-left:6px solid var(--blue);clip-path:polygon(0 0,100% 0,calc(100% - 14px) 100%,0 100%)}
.p .n{flex:1;font-size:22px;font-weight:500;white-space:nowrap}
.p .k{font-family:'Barlow Condensed',sans-serif;font-size:30px;font-weight:600;color:var(--gold)}
</style>
</head>
<body>
<div id="stage">
 <div id="ov">
  <div id="mm"></div>
  <div id="score">
    <div class="side l">
      <div class="name" id="nameL"></div>
      <div class="mini"><span>TWR <b id="twL">0</b></span><span>GOLD <b id="gdL">0</b></span></div>
      <div class="kills" id="kL">0</div>
    </div>
    <div class="mid"><div id="timer">00:00</div><small>MATCH</small></div>
    <div class="side r">
      <div class="name" id="nameR"></div>
      <div class="mini"><span>TWR <b id="twR">0</b></span><span>GOLD <b id="gdR">0</b></span></div>
      <div class="kills" id="kR">0</div>
    </div>
  </div>
  <div class="col" id="colL"></div>
 </div>
</div>

<script>
/* ====== EDIT DI SINI ====== */
const CFG = {
  left:  { name:"DARKSYSTEM",  kills:0, towers:null, gold:null, players:[] },
  right: { name:"MUSUH ALLAH", kills:0, towers:null, gold:null, players:[] },
  wsUrl: "ws://localhost:8765"
};
/* ========================== */

const $ = id => document.getElementById(id);
const ov = $('ov');
let secs = 0, tick = null, ext = false;

/* Posisi bisa diatur lewat URL, tanpa upload ulang:
   ?demo=1&mm=4,638,174,198&sb=1166&kda=850
   mm = x,y,lebar,tinggi bingkai minimap | sb = posisi scoreboard (y) | kda = posisi kartu KDA (y)
   Satuan piksel pada kanvas 1080x1920. */
const Q = new URLSearchParams(location.search);
let mm = [4, 638, 174, 198];
if (Q.get('mm')) { const a = Q.get('mm').split(',').map(Number); if (a.length === 4 && a.every(n => !isNaN(n))) mm = a; }
$('mm').style.cssText = 'left:'+mm[0]+'px;top:'+mm[1]+'px;width:'+mm[2]+'px;height:'+mm[3]+'px';
if (Q.get('sb'))  document.documentElement.style.setProperty('--sb', parseFloat(Q.get('sb')) + 'px');
if (Q.get('kda')) document.documentElement.style.setProperty('--cy', parseFloat(Q.get('kda')) + 'px');

function fit(){ const s=Math.min(innerWidth/1080, innerHeight/1920); $('stage').style.transform='scale('+s+')'; }
addEventListener('resize',fit); fit();

function cards(el, list){
  el.innerHTML = list.map(p=>'<div class="p"><div class="n">'+p.n+'</div><div class="k">'+p.k+'</div></div>').join('');
}
function opt(id,v){ const e=$(id); e.textContent=v==null?'':v; e.parentElement.style.display=v==null?'none':''; }
function render(){
  const L=CFG.left,R=CFG.right;
  $('nameL').textContent=L.name; $('nameR').textContent=R.name;
  $('kL').textContent=L.kills; $('kR').textContent=R.kills;
  opt('twL',L.towers); opt('twR',R.towers); opt('gdL',L.gold); opt('gdR',R.gold);
  cards($('colL'),L.players);
}
function fmt(s){ return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); }

function show(){
  if(ov.classList.contains('on')) return;
  ov.classList.add('on');
  if(ext) return;
  secs=0; $('timer').textContent=fmt(0);
  clearInterval(tick); tick=setInterval(()=>{ secs++; $('timer').textContent=fmt(secs); },1000);
}
function hide(){ ov.classList.remove('on'); clearInterval(tick); }

/* Kontrol manual: S = muncul/hilang, Q/A = kill kiri +/-, E/D = kill kanan +/- */
addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if(k==='s') ov.classList.contains('on')?hide():show();
  if(k==='q'){CFG.left.kills++;render()} if(k==='a'){CFG.left.kills=Math.max(0,CFG.left.kills-1);render()}
  if(k==='e'){CFG.right.kills++;render()} if(k==='d'){CFG.right.kills=Math.max(0,CFG.right.kills-1);render()}
});

/* Data otomatis dari mlbb_tracker.py lewat WebSocket */
function connect(){
  try{
    const ws=new WebSocket(CFG.wsUrl);
    ws.onmessage=m=>{
      try{
        const d=JSON.parse(m.data);
        if(d.left) Object.assign(CFG.left,d.left);
        if(d.right) Object.assign(CFG.right,d.right);
        if(d.timer){ ext=true; clearInterval(tick); $('timer').textContent=d.timer; }
        render();
        if(d.show===true) show(); if(d.show===false) hide();
      }catch(_){}
    };
    ws.onclose=()=>{ if(ext) hide(); setTimeout(connect,3000); };
    ws.onerror=()=>ws.close();
  }catch(_){ setTimeout(connect,5000); }
}
render(); connect();

/* Tes tampilan: ?demo=1 menampilkan overlay terus dengan data contoh */
if(/[?&]demo=1/.test(location.search)){
  CFG.left.kills=5; CFG.right.kills=3;
  CFG.left.players=[{n:"KDA",k:"5/2/7"}];
  render(); show();
}
</script>
</body>
</html>
