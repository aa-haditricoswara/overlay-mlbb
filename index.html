<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"><title>Overlay MLBB</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600;700&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:transparent;overflow:hidden}
#stage{position:absolute;left:0;top:0;width:1080px;height:1920px;transform-origin:0 0;font-family:'Oswald','Arial Narrow',sans-serif;color:#fff}
body.bg #stage{background:linear-gradient(#1c2b22,#27402f 60%,#1c2b22)}
.pn{position:absolute;box-sizing:border-box}
.pn>svg{width:100%;height:100%;display:block;overflow:visible}

/* plakat nama tim */
.nm{display:flex;align-items:center;justify-content:center;overflow:hidden;font-weight:700;font-style:italic;letter-spacing:1px;white-space:nowrap;text-shadow:0 1px 3px rgba(0,0,0,.7)}
#nl{background:linear-gradient(90deg,#08182a,#0d3550);border-bottom:2px solid #e3b449;clip-path:polygon(0 0,100% 0,95% 100%,0 100%)}
#nr{background:linear-gradient(270deg,#08182a,#0d3550);border-bottom:2px solid #e3b449;clip-path:polygon(5% 0,100% 0,100% 100%,0 100%)}
.nm::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 35%,rgba(255,255,255,.35) 50%,transparent 65%);transform:translateX(-130%);animation:sh 5s ease-in-out infinite}
#nr::after{animation-delay:.7s}
@keyframes sh{0%,55%{transform:translateX(-130%)}100%{transform:translateX(130%)}}

/* cahaya emblem */
#em svg,#eb svg,.xx.gw svg{animation:glow 3.5s ease-in-out infinite alternate}
@keyframes glow{from{filter:drop-shadow(0 0 2px rgba(60,210,255,.35))}to{filter:drop-shadow(0 0 8px rgba(80,220,255,.9))}}
</style></head><body>

<!-- definisi warna dipakai bersama -->
<svg width="0" height="0" style="position:absolute"><defs>
 <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff2b8"/><stop offset=".5" stop-color="#e3b449"/><stop offset="1" stop-color="#9a6f1c"/></linearGradient>
 <linearGradient id="teal" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#14566b"/><stop offset="1" stop-color="#08202e"/></linearGradient>
 <linearGradient id="gem" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d8fbff"/><stop offset=".5" stop-color="#2fd0ff"/><stop offset="1" stop-color="#0a7fb5"/></linearGradient>
 <radialGradient id="spot"><stop offset="0" stop-color="#5fe3ff" stop-opacity=".9"/><stop offset="1" stop-color="#5fe3ff" stop-opacity="0"/></radialGradient>
 <g id="wg"><polygon points="100,18 40,6 6,16 60,22 14,24 62,30 20,34 70,44 100,56" fill="url(#gold)"/></g>
</defs></svg>

<div id="stage">

 <!-- bar atas -->
 <div class="pn" id="tb"><svg viewBox="0 0 864 48" preserveAspectRatio="none">
  <path d="M0 0H864V20L848 33H0Z" fill="url(#teal)"/>
  <path d="M0 33H846" stroke="#e3b449" stroke-width="1.5" vector-effect="non-scaling-stroke" fill="none"/>
  <path d="M0 28H838" stroke="#2fd0ff" stroke-width="1" opacity=".55" vector-effect="non-scaling-stroke" fill="none"/>
  <path d="M24 4L4 30M16 4L-4 30M32 4L12 30" stroke="#e3b449" stroke-width="3" vector-effect="non-scaling-stroke" fill="none"/>
  <polygon points="24,2 52,2 78,31 50,31" fill="url(#gold)"/>
  <polygon points="624,2 596,2 570,31 598,31" fill="url(#gold)"/>
  <path d="M662 4L642 30M654 4L634 30M646 4L626 30" stroke="#e3b449" stroke-width="3" vector-effect="non-scaling-stroke" fill="none"/>
  <path d="M690 22H824" stroke="#e3b449" stroke-width="1.5" vector-effect="non-scaling-stroke" fill="none"/>
  <polygon points="824,3 864,3 864,40 852,24 824,24" fill="url(#gold)"/>
 </svg></div>

 <!-- bar bawah -->
 <div class="pn" id="bb"><svg viewBox="0 0 1080 55" preserveAspectRatio="none">
  <defs><g id="bs">
   <polygon points="0,14 24,4 74,4 56,18 12,18 0,28" fill="url(#gold)"/>
   <polygon points="276,13 370,13 358,29 264,29" fill="url(#gold)"/>
   <path d="M216 14L200 42M208 14L192 42M200 14L184 42" stroke="#e3b449" stroke-width="3" vector-effect="non-scaling-stroke" fill="none"/>
   <circle cx="150" cy="44" r="16" fill="url(#spot)"/>
  </g></defs>
  <path d="M0 16L26 10H1054L1080 16V46L1054 52H26L0 46Z" fill="url(#teal)"/>
  <path d="M30 24H1050M30 44H1050" stroke="#e3b449" stroke-width="1.5" vector-effect="non-scaling-stroke" fill="none"/>
  <use href="#bs"/>
  <use href="#bs" transform="translate(1080 0) scale(-1 1)"/>
 </svg></div>

 <!-- minimap -->
 <div class="pn" id="mm"><svg viewBox="0 0 215 175" preserveAspectRatio="none">
  <path d="M5 5H210V118L155 170H5Z" fill="none" stroke="#0f4b60" stroke-width="8" vector-effect="non-scaling-stroke"/>
  <path d="M5 5H210V118L155 170H5Z" fill="none" stroke="#e3b449" stroke-width="3" vector-effect="non-scaling-stroke"/>
  <path d="M1.5 1.5H213.5V120L157 173.5H1.5Z" fill="none" stroke="#e3b449" stroke-width="1.2" opacity=".8" vector-effect="non-scaling-stroke"/>
  <path d="M210 118L155 170" stroke="#2fd0ff" stroke-width="2" opacity=".8" vector-effect="non-scaling-stroke" fill="none"/>
 </svg></div>

 <!-- plakat nama -->
 <div class="pn nm" id="nl"><span id="nlt"></span></div>
 <div class="pn nm" id="nr"><span id="nrt"></span></div>

 <!-- emblem atas -->
 <div class="pn" id="em"><svg viewBox="0 0 210 110" preserveAspectRatio="xMidYMid meet">
    <use href="#wg"/><use href="#wg" transform="translate(210 0) scale(-1 1)"/>
  <ellipse cx="62" cy="52" rx="22" ry="7" fill="url(#spot)"/><ellipse cx="148" cy="52" rx="22" ry="7" fill="url(#spot)"/>
  <polygon points="105,0 128,30 105,108 82,30" fill="url(#gold)" stroke="#fff3c4" stroke-width="1"/>
  <polygon points="105,10 120,30 105,92 90,30" fill="#0b2a3a"/>
  <polygon points="105,14 112,30 105,46 98,30" fill="url(#gem)"/>
 </svg></div>

 <!-- ornamen bawah -->
 <div class="pn" id="eb"><svg viewBox="0 0 100 60" preserveAspectRatio="xMidYMid meet">
  <polygon points="4,30 30,24 40,30 30,36" fill="url(#gold)"/><polygon points="96,30 70,24 60,30 70,36" fill="url(#gold)"/>
  <polygon points="50,2 74,26 50,58 26,26" fill="url(#gold)" stroke="#fff3c4" stroke-width="1"/>
  <polygon points="50,10 65,26 50,48 35,26" fill="#0b2a3a"/>
  <polygon points="50,16 57,28 50,40 43,28" fill="url(#gem)"/>
 </svg></div>

</div>

<script>
const TOPIC="darksystem-mlbb-ganti-ini-7k2q";   /* SAMA persis dengan di control.html */
const NAMA_KIRI="DARKSYSTEM", NAMA_KANAN="MUSUH ALLAH";   /* cadangan bila belum ada data dari control, atau pakai ?l=...&r=... */
const $=id=>document.getElementById(id),Q=new URLSearchParams(location.search);
const D={tb:[216,551,864,48],nl:[282,565,195,30],nr:[603,565,195,30],em:[472,551,136,72],mm:[2,553,215,175],bb:[0,1203,1080,55],eb:[490,1198,100,60]};  /* SAMA dengan DEF di control.html */
let S={};
try{S=JSON.parse(localStorage.ovlState)||{}}catch(_){}

function setT(id,t){const el=$(id),s=el.firstChild,m=+((S.fs||{})[id])>0;s.textContent=t;
 let f=m?+S.fs[id]:(parseFloat(el.style.fontSize)||20);el.style.fontSize=f+'px';
 if(!m)while(s.scrollWidth>el.clientWidth*.82&&f>8){f--;el.style.fontSize=f+'px'}}
/* ornamen tambahan dari control */
const EX={
 diamond:'<svg viewBox="0 0 100 60" preserveAspectRatio="xMidYMid meet"><polygon points="4,30 30,24 40,30 30,36" fill="url(#gold)"/><polygon points="96,30 70,24 60,30 70,36" fill="url(#gold)"/><polygon points="50,2 74,26 50,58 26,26" fill="url(#gold)" stroke="#fff3c4" stroke-width="1"/><polygon points="50,10 65,26 50,48 35,26" fill="#0b2a3a"/><polygon points="50,16 57,28 50,40 43,28" fill="url(#gem)"/></svg>',
 wing:'<svg viewBox="0 0 210 110" preserveAspectRatio="xMidYMid meet"><use href="#wg"/><use href="#wg" transform="translate(210 0) scale(-1 1)"/><ellipse cx="62" cy="52" rx="22" ry="7" fill="url(#spot)"/><ellipse cx="148" cy="52" rx="22" ry="7" fill="url(#spot)"/><polygon points="105,0 128,30 105,108 82,30" fill="url(#gold)" stroke="#fff3c4" stroke-width="1"/><polygon points="105,10 120,30 105,92 90,30" fill="#0b2a3a"/><polygon points="105,14 112,30 105,46 98,30" fill="url(#gem)"/></svg>',
 line:'<svg viewBox="0 0 200 10" preserveAspectRatio="none"><path d="M0 3H200" fill="none" stroke="#e3b449" stroke-width="2" vector-effect="non-scaling-stroke"/><path d="M0 7H200" fill="none" stroke="#2fd0ff" stroke-width="1" opacity=".6" vector-effect="non-scaling-stroke"/></svg>',
 hatch:'<svg viewBox="0 0 40 28" preserveAspectRatio="none"><path d="M30 2L10 26M22 2L2 26M38 2L18 26" stroke="#e3b449" stroke-width="3" vector-effect="non-scaling-stroke" fill="none"/></svg>',
 slash:'<svg viewBox="0 0 60 30" preserveAspectRatio="none"><polygon points="20,0 60,0 40,30 0,30" fill="url(#gold)"/></svg>',
 glow:'<svg viewBox="0 0 40 40" preserveAspectRatio="none"><circle cx="20" cy="20" r="20" fill="url(#spot)"/></svg>'};
function ap(){
 const L=Object.assign({},D,S.lay||{}),H=S.hid||{},ex=S.ex||[];
 document.querySelectorAll('.xx').forEach(e=>{if(!ex.some(o=>o.k==e.id))e.remove()});
 ex.forEach(o=>{if(!$(o.k)&&EX[o.t]){const d=document.createElement('div');d.className='pn xx'+(o.t=='diamond'||o.t=='wing'?' gw':'');d.id=o.k;d.innerHTML=EX[o.t];$('stage').appendChild(d)}});
 Object.keys(D).concat(ex.map(o=>o.k)).forEach(k=>{const el=$(k),b=L[k];if(!el||!Array.isArray(b)||b.length!=4)return;
  const s=el.style;s.left=b[0]+'px';s.top=b[1]+'px';s.width=b[2]+'px';s.height=b[3]+'px';s.display=H[k]?'none':'';
  if(k=='nl'||k=='nr')s.fontSize=Math.round(b[3]*.62)+'px'});
 setT('nl',(S.left&&S.left.name)||Q.get('l')||NAMA_KIRI);
 setT('nr',(S.right&&S.right.name)||Q.get('r')||NAMA_KANAN);
}
if(Q.get('bg'))document.body.classList.add('bg');
function fit(){$('stage').style.transform='scale('+Math.min(innerWidth/1080,innerHeight/1920)+')'}
addEventListener('resize',fit);fit();
ap();
document.fonts&&document.fonts.ready.then(ap);

/* terima perubahan dari halaman control */
const es=new EventSource('https://ntfy.sh/'+TOPIC+'/sse?since=12h');
es.onmessage=e=>{try{const m=JSON.parse(e.data);if(m.event!='message')return;const o=JSON.parse(m.message);
 if(o&&o.left){S=o;try{localStorage.ovlState=m.message}catch(_){}ap()}}catch(_){}};
</script></body></html>
