<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"><title>Overlay MLBB</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600;700&display=swap" rel="stylesheet">
<style>
@property --a{syntax:'<angle>';initial-value:0deg;inherits:false}
:root{--nm:612px}
html,body{margin:0;height:100%;background:transparent;overflow:hidden}
#stage{position:absolute;left:0;top:0;width:1080px;height:1920px;transform-origin:0 0;font-family:'Oswald','Arial Narrow',sans-serif;color:#fff}
body.bg #stage{background:linear-gradient(#1c2b22,#27402f 60%,#1c2b22)}

/* bingkai utama + kilatan cahaya */
#fr{position:absolute;border-radius:18px;box-shadow:inset 0 0 28px rgba(255,205,120,.14),0 0 22px rgba(255,205,120,.25)}
#fr::before,#fr::after{content:"";position:absolute;inset:0;border-radius:18px;padding:5px;
 -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
#fr::after{background:linear-gradient(135deg,#7a5a22,#f7e6a8 25%,#b08a35 50%,#f7e6a8 75%,#7a5a22)}
#fr::before{z-index:1;background:conic-gradient(from var(--a),transparent 0 72%,rgba(255,255,255,.15) 80%,#fff 93%,#ffe9a8 96%,transparent 100%);animation:spin 5s linear infinite}
@keyframes spin{to{--a:360deg}}

/* plakat nama tim */
.nm{position:absolute;top:var(--nm);width:250px;height:46px;display:flex;align-items:center;justify-content:center;overflow:hidden;
 font-weight:700;font-size:26px;letter-spacing:2px;white-space:nowrap}
.nm.l{left:190px;background:linear-gradient(90deg,rgba(10,14,26,.92),rgba(12,44,112,.94));border-bottom:3px solid #3a82ff;clip-path:polygon(0 0,100% 0,calc(100% - 16px) 100%,0 100%)}
.nm.r{right:190px;background:linear-gradient(270deg,rgba(10,14,26,.92),rgba(106,12,28,.94));border-bottom:3px solid #ff4a62;clip-path:polygon(16px 0,100% 0,100% 100%,0 100%)}
.nm::after,#mm::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 35%,rgba(255,255,255,.4) 50%,transparent 65%);transform:translateX(-130%);animation:sh 5s ease-in-out infinite}
.nm.r::after{animation-delay:.7s}#mm::after{animation-delay:1.4s}
@keyframes sh{0%,55%{transform:translateX(-130%)}100%{transform:translateX(130%)}}

/* bingkai minimap */
#mm{position:absolute;box-sizing:border-box;overflow:hidden;border:4px solid;border-image:linear-gradient(135deg,#7a5a22,#f7e6a8,#b08a35,#f7e6a8,#7a5a22) 1;box-shadow:0 0 14px rgba(255,205,120,.35)}
</style></head><body>
<div id="stage">
 <div id="fr"></div>
 <div id="mm"></div>
 <div class="nm l" id="nl"></div>
 <div class="nm r" id="nr"></div>
</div>
<script>
const NAMA_KIRI="DARKSYSTEM", NAMA_KANAN="MUSUH ALLAH";   /* ganti nama tim di sini */
const $=id=>document.getElementById(id),Q=new URLSearchParams(location.search);
$('nl').textContent=Q.get('l')||NAMA_KIRI;$('nr').textContent=Q.get('r')||NAMA_KANAN;
/* Posisi (kanvas 1080x1920): ?fr=x,y,lebar,tinggi  ?mm=x,y,lebar,tinggi  ?nm=y   ?bg=1 = latar tes */
function box(id,key,d){let a=d;if(Q.get(key)){const t=Q.get(key).split(',').map(Number);if(t.length==4&&t.every(n=>!isNaN(n)))a=t}
 $(id).style.cssText+=';left:'+a[0]+'px;top:'+a[1]+'px;width:'+a[2]+'px;height:'+a[3]+'px'}
box('fr','fr',[0,551,1080,707]);box('mm','mm',[4,638,174,198]);
if(Q.get('nm'))document.documentElement.style.setProperty('--nm',parseFloat(Q.get('nm'))+'px');
if(Q.get('bg'))document.body.classList.add('bg');
function fit(){$('stage').style.transform='scale('+Math.min(innerWidth/1080,innerHeight/1920)+')'}addEventListener('resize',fit);fit();
</script></body></html>
